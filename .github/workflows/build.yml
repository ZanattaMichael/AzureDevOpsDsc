name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Module and Generate DSC v3 Manifests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache required build modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: output/RequiredModules
          key: ${{ runner.os }}-requiredmodules-${{ hashFiles('RequiredModules.psd1') }}

      - name: Build module
        shell: pwsh
        run: |
          ./build.ps1 -ResolveDependency -Tasks build

      # The publish workflow runs `docs` as part of packaging a release, so it is
      # exercised here on every push and PR - a broken doc-generation task should
      # surface in normal CI, not for the first time midway through a release.
      - name: Generate conceptual help and wiki content
        shell: pwsh
        run: |
          ./build.ps1 -Tasks docs

      - name: Generate DSC v3 adapted resource manifests
        shell: pwsh
        run: |
          ./build.ps1 -Tasks dscv3

      - name: Upload built module
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: built-module
          path: output/builtModule
          if-no-files-found: error

      - name: Upload DSC v3 manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsc-v3-manifests
          path: |
            output/builtModule/**/*.dsc.adaptedResource.json
            output/builtModule/**/*.dsc.manifests.json
          if-no-files-found: error
