name: Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Module
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          .\build.ps1 -Tasks noop -ResolveDependency

      - name: Build module
        shell: pwsh
        run: |
          .\build.ps1 -Tasks build

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-build-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PowerShell Gallery
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: module-build-${{ github.run_number }}
          path: output/

      - name: Publish to PSGallery
        shell: pwsh
        env:
          PS_GALLERY_API_KEY: ${{ secrets.PS_GALLERY_API_KEY }}
        run: |
          $modulePath = Get-ChildItem -Path ./output/AzureDevOpsDsc -Directory |
              Sort-Object Name -Descending | Select-Object -First 1
          if (-not $modulePath) {
              throw "Built module directory not found under ./output/AzureDevOpsDsc"
          }
          Write-Host "Publishing $($modulePath.FullName) to PSGallery..."
          Publish-Module -Path $modulePath.FullName `
              -NuGetApiKey $env:PS_GALLERY_API_KEY `
              -Repository PSGallery `
              -Verbose
