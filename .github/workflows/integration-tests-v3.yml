name: DSC v3 Integration Tests

# DSC v3 integration tests run against a live Azure DevOps organization on the
# self-hosted AZDO-AGENT runner, driving the module's class-based resources through
# the `dsc` CLI and its PowerShell adapter.
#
# Deliberately a separate workflow from integration-tests.yml. The v2 suite takes the
# better part of an hour; running the v3 suite inside it means waiting out v2 to learn
# anything about v3. Split, the two can be dispatched, gated and re-run independently.
# Both target the same single self-hosted runner, so they queue rather than contend.
#
# One-time repository setup required (repository scope, NOT an Environment) - the same
# variable and secret integration-tests.yml uses:
#   1. Add repository variable:  AzureDevOpsOrg   (your Azure DevOps org name)
#   2. Add repository secret:    AZURE_DEVOPS_PAT (a PAT with full-access scopes)
#      Leave AZURE_DEVOPS_PAT empty to use Managed Identity instead
#      (only valid when AZDO-AGENT runs on an Azure VM/Arc machine).

on:
  # TEMPORARY - validation trigger for the DSC v3 suite added in this branch, so the
  # steps below actually execute at least once before they land on main.
  #
  # A push filter matches the branch that was pushed, unlike `pull_request`, whose
  # `branches:` filter matches the BASE branch and would therefore fire this live-org
  # suite on every PR targeting main.
  #
  # Remove this trigger before merging (or widen it deliberately, if the project
  # decides the suite should gate pull requests).
  push:
    branches:
      - claude/pr-51-continuation-ncxcao
  workflow_dispatch:
    inputs:
      allowFailures:
        description: >-
          Exit 0 even if individual v3 integration tests fail (setup/infrastructure
          failures still fail the run). Useful for running the suite on a preview
          branch without gating on in-progress tests.
        required: false
        default: false
        type: boolean
  # Called by publish.yml as a release gate, alongside the v2 suite.
  workflow_call:
    inputs:
      moduleVersion:
        description: >-
          Version to build and test. The publish workflow passes the version derived
          from the release tag so the tests exercise the exact build being released.
          Left empty, the build falls back to the manifest version.
        required: false
        type: string
      allowFailures:
        description: >-
          Exit 0 even if individual v3 integration tests fail. Set by publish.yml on a
          prerelease tag. Setup/infrastructure failures still fail the run.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  integration-tests-v3:
    name: Run DSC v3 Integration Tests
    runs-on: AZDO-AGENT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          .\build.ps1 -Tasks noop -ResolveDependency

      - name: Build module
        shell: pwsh
        env:
          ModuleVersion: ${{ inputs.moduleVersion }}
        run: |
          .\build.ps1 -Tasks build

      # The self-hosted runner does not ship Pester 5, and Invoke-V3Tests.ps1 declares
      # `#Requires -Modules @{ ModuleName="Pester"; ModuleVersion="5.0.0" }`, so without
      # this the script refuses to start and the suite never runs at all. Pinned to the
      # same version the unit test and publish workflows install.
      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          $pester = Get-Module -Name Pester -ListAvailable |
              Where-Object Version -ge ([version]'5.0.0') |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if (-not $pester) {
              throw "Pester 5.x is not available after install - Invoke-V3Tests.ps1 cannot run."
          }
          Write-Host "Pester $($pester.Version) available at $($pester.ModuleBase)"

      # Point PSModulePath at exactly one copy of each module the tests load. See the
      # equivalent step in integration-tests.yml for the full rationale: a module
      # reachable from two locations makes Get-Module return an array, which DSC cannot
      # cast to [PSModuleInfo]. The v3 PowerShell adapter resolves this module's
      # class-based resources off PSModulePath too, so the same single-copy guarantee
      # applies here.
      - name: Set PSModulePath to the built module only
        shell: pwsh
        run: |
          $outputPath = (Resolve-Path -Path .\output).Path
          $builtModulePath = Join-Path -Path $outputPath -ChildPath 'builtModule'
          $nestedModulePaths = @(
              Get-ChildItem -Path (Join-Path -Path $builtModulePath -ChildPath '*/*/Modules') -Directory -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
          )

          # Keep the runner's default user/system module paths (Pester, base modules) but
          # drop anything under this repo's ./output and any stale C:\Temp\DSCModule copies,
          # so nothing outside the freshly built module can provide a second copy.
          $keep = $env:PSModulePath -split ';' | Where-Object {
              $_ -and
              $_ -notlike "$outputPath*" -and
              $_ -notlike 'C:\Temp\DSCModule*'
          }

          $ordered = @($builtModulePath) + $nestedModulePaths + $keep
          $env:PSModulePath = ($ordered | Where-Object { $_ } | Select-Object -Unique) -join ';'

          # Persist for subsequent steps via $GITHUB_ENV
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'PSModulePath entries:'
          $env:PSModulePath -split ';' | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }

          # Assert each module resolves from exactly one location, failing here naming the
          # module and its locations rather than deep inside the DSC adapter.
          foreach ($name in 'DscResource.Common', 'AzureDevOpsDsc.Common', 'AzureDevOpsDscNative') {
              $bases = @(Get-Module -Name $name -ListAvailable | Select-Object -ExpandProperty ModuleBase -Unique)
              if ($bases.Count -eq 0) {
                  throw "Module '$name' is not resolvable on PSModulePath after the build - the integration tests cannot initialise."
              }
              if ($bases.Count -gt 1) {
                  throw "Module '$name' resolves from $($bases.Count) locations, which makes the DSC PowerShell adapter throw on a [PSModuleInfo] cast: $($bases -join ' ; ')"
              }
              Write-Host "Resolved $name -> $($bases[0])"
          }

      - name: Write test framework configuration
        shell: pwsh
        env:
          AZURE_DEVOPS_ORG: ${{ vars.AzureDevOpsOrg }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_DEVOPS_ORG)) {
              throw "Required variable 'AzureDevOpsOrg' is not set. " +
                    "Add it under Settings > Secrets and variables > Actions > Variables."
          }
          $authType = if (-not [string]::IsNullOrEmpty($env:AZURE_DEVOPS_PAT)) { 'PAT' } else { 'ManagedIdentity' }
          Write-Host "Organization : $($env:AZURE_DEVOPS_ORG)"
          Write-Host "Auth type    : $authType"

          $config = [ordered]@{
              Organization       = $env:AZURE_DEVOPS_ORG
              AuthenticationType = $authType
              excludedProjectsFromTeardown = @()
          }
          if ($authType -eq 'PAT') {
              $config.PATToken = $env:AZURE_DEVOPS_PAT
          }
          $config | ConvertTo-Json -Depth 3 |
              Set-Content -Path .\tests\Integration\TestFrameworkConfiguration.json -Encoding UTF8
          Write-Host "TestFrameworkConfiguration.json written."

      - name: Prepare cache directory
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:TEMP 'AzureDevOpsDscCache'
          New-Item -Path $cacheDir -ItemType Directory -Force | Out-Null
          "AZDODSC_CACHE_DIRECTORY=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Cache directory: $cacheDir"

      - name: Install DSC v3 CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dscDir = 'C:\dsc'

          # Already on PATH (pre-installed on the runner image)? Nothing to do.
          if (Get-Command dsc -CommandType Application -ErrorAction SilentlyContinue) {
              Write-Host "DSC v3 already available: $(dsc --version 2>&1)"
          }
          elseif (Test-Path (Join-Path $dscDir 'dsc.exe')) {
              # Installed by a previous run on this self-hosted runner - reuse it rather
              # than re-downloading; only the PATH entry is per-run.
              $dscDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Reusing existing DSC v3 install at $dscDir"
          }
          else {
              Write-Host "Downloading DSC v3..."
              # Authenticated so the release lookup is not subject to the unauthenticated
              # api.github.com rate limit, which a shared self-hosted runner can exhaust.
              $headers = @{
                  'Accept'               = 'application/vnd.github+json'
                  'X-GitHub-Api-Version' = '2022-11-28'
              }
              if (-not [string]::IsNullOrEmpty($env:GH_TOKEN)) {
                  $headers['Authorization'] = "Bearer $($env:GH_TOKEN)"
              }
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/PowerShell/DSC/releases/latest' -Headers $headers
              $asset = $release.assets |
                  Where-Object { $_.name -match 'x86_64-pc-windows-msvc\.zip$' } |
                  Select-Object -First 1
              if (-not $asset) {
                  throw "No x86_64-pc-windows-msvc .zip asset found in DSC release '$($release.tag_name)'. Assets: $($release.assets.name -join ', ')"
              }
              $zipPath = Join-Path $env:RUNNER_TEMP 'dsc-v3.zip'
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath -UseBasicParsing
              Expand-Archive -Path $zipPath -DestinationPath $dscDir -Force
              Remove-Item -Path $zipPath -Force -ErrorAction SilentlyContinue
              if (-not (Test-Path (Join-Path $dscDir 'dsc.exe'))) {
                  throw "dsc.exe not found under $dscDir after extracting $($asset.name)."
              }
              # Add to PATH for subsequent steps
              $dscDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "DSC v3 $($release.tag_name) installed to $dscDir"
          }

      - name: Prepare results directory
        shell: pwsh
        run: |
          New-Item -Path 'C:\Temp' -ItemType Directory -Force | Out-Null

      - name: Run DSC v3 integration tests
        shell: pwsh
        working-directory: tests/Integration/V3
        env:
          # Booleans from workflow inputs arrive as PowerShell literals. Normalise to a
          # bare 'true'/'false' string so the pwsh block below can treat it uniformly.
          ALLOW_FAILURES: ${{ inputs.allowFailures && 'true' || 'false' }}
        run: |
          $params = @{
              TestFrameworkConfigurationPath = '..\TestFrameworkConfiguration.json'
              ResultsPath                    = 'C:\Temp\v3-integration-test-results.xml'
          }
          if ($env:ALLOW_FAILURES -eq 'true') {
              Write-Host 'AllowFailures is enabled - test failures will be reported but will not fail this run.'
              $params['AllowFailures'] = $true
          }
          .\Invoke-V3Tests.ps1 @params

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-integration-test-results-${{ github.run_number }}
          path: C:\Temp\v3-integration-test-results.xml
          if-no-files-found: ignore
