name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache required build modules
        uses: actions/cache@v4
        with:
          path: output/RequiredModules
          key: ${{ runner.os }}-requiredmodules-${{ hashFiles('RequiredModules.psd1') }}

      - name: Build module
        shell: pwsh
        run: |
          ./build.ps1 -ResolveDependency -Tasks build

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run Classes unit tests
        shell: pwsh
        run: |
          # Classes-suite test files resolve their classes via `using module AzureDevOpsDscNative`
          # against the built module, rather than dot-sourcing raw source - dot-sourcing classes
          # across Pester's per-block session-state boundaries intermittently produced
          # "Could not find type [X]" on cold runners. `using module` resolves at parse time,
          # before any script code runs, so PSModulePath must already be correct here.
          #
          # Some DSC resource classes' Construct() also explicitly re-imports the
          # AzureDevOpsDsc.Common nested module by bare name (Import-Module AzureDevOpsDsc.Common),
          # which only resolves via PSModulePath - it isn't found via output\builtModule itself,
          # since it lives one level down at <builtModule>\AzureDevOpsDscNative\<version>\Modules.
          # That subfolder path is resolved dynamically here to avoid hardcoding the module version.
          $builtModulesDir = (Get-ChildItem -Path "$PWD\output\builtModule\AzureDevOpsDscNative\*\Modules" -Directory -ErrorAction Stop | Select-Object -First 1).FullName
          $env:PSModulePath = "$PWD\output\RequiredModules;$PWD\output\builtModule;$builtModulesDir;$env:PSModulePath"
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force
          # *>&1 (not 2>&1) is required: Pester's colored summary/pass-fail lines go through
          # Write-Host, which writes to the Information stream (6), not Error (2) - 2>&1 alone
          # silently drops them, leaving $output with no parseable summary and an empty log file.
          ./azuredevopsdsc.tests.ps1 *>&1 | Tee-Object -Variable output
          $output | Out-File -FilePath classes-tests.log -Encoding utf8
          # Match each summary value independently rather than one pattern spanning all three -
          # Write-Host segments can land in separate array elements, so "Tests Passed:", "Failed:"
          # and "Skipped:" aren't reliably on what $output treats as a single "line".
          $joined = $output | Out-String
          $passedMatch = [regex]::Matches($joined, 'Tests Passed:\s*(\d+)') | Select-Object -Last 1
          $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
          $skippedMatch = [regex]::Matches($joined, 'Skipped:\s*(\d+)') | Select-Object -Last 1
          if (-not $passedMatch -or -not $failedMatch) {
              Write-Error "Could not find a test result summary in the output."
              exit 1
          }
          $failed = [int]$failedMatch.Groups[1].Value
          Write-Host "Classes suite -> Passed: $($passedMatch.Groups[1].Value), Failed: $failed, Skipped: $($skippedMatch.Groups[1].Value)"
          if ($failed -gt 0) {
              Write-Error "$failed unit test(s) failed in the Classes suite."
              exit 1
          }

      - name: Run Common module unit tests
        shell: pwsh
        run: |
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force
          # *>&1 (not 2>&1) is required: Pester's colored summary/pass-fail lines go through
          # Write-Host, which writes to the Information stream (6), not Error (2) - 2>&1 alone
          # silently drops them, leaving $output with no parseable summary and an empty log file.
          ./azuredevopsdsc.common.tests.ps1 *>&1 | Tee-Object -Variable output
          $output | Out-File -FilePath common-tests.log -Encoding utf8
          $joined = $output | Out-String
          $passedMatch = [regex]::Matches($joined, 'Tests Passed:\s*(\d+)') | Select-Object -Last 1
          $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
          $skippedMatch = [regex]::Matches($joined, 'Skipped:\s*(\d+)') | Select-Object -Last 1
          if (-not $passedMatch -or -not $failedMatch) {
              Write-Error "Could not find a test result summary in the output."
              exit 1
          }
          $failed = [int]$failedMatch.Groups[1].Value
          Write-Host "Common suite -> Passed: $($passedMatch.Groups[1].Value), Failed: $failed, Skipped: $($skippedMatch.Groups[1].Value)"
          if ($failed -gt 0) {
              Write-Error "$failed unit test(s) failed in the Common suite."
              exit 1
          }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs
          path: |
            classes-tests.log
            common-tests.log
          if-no-files-found: ignore
