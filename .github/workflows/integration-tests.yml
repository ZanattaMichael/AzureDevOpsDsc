name: Integration Tests

# Integration tests run against a live Azure DevOps organization on the
# self-hosted AZDO-AGENT runner. This is an ordinary Actions workflow job, not a
# deployment.
#
# It runs when dispatched manually, when called by publish.yml as a release gate, and
# - TEMPORARILY - on every push to a pull request whose HEAD branch is prefixed
# `resource-add/`, draft or not, so a batch of new resources is exercised against a real
# organization while it is being worked on. It still never fires on an ordinary push, or
# on a PR from any other branch prefix.
# Remove the `pull_request` trigger and the head_ref condition on the job below to put
# this back to dispatch-only.
#
# One-time repository setup required (repository scope, NOT an Environment):
#   1. Add repository variable:  AzureDevOpsOrg   (your Azure DevOps org name)
#   2. Add repository secret:    AZURE_DEVOPS_PAT (a PAT with full-access scopes)
#      Leave AZURE_DEVOPS_PAT empty to use Managed Identity instead
#      (only valid when AZDO-AGENT runs on an Azure VM/Arc machine).
# These must be repository-level, not scoped to a GitHub Environment, since this
# job no longer references one.

on:
  workflow_dispatch:
    inputs:
      allowFailures:
        description: >-
          Exit 0 even if individual integration tests fail (setup/infrastructure
          failures still fail the run). Useful for running the suite on a preview
          branch without gating on flaky tests.
        required: false
        default: false
        type: boolean
  # Called by publish.yml as a release gate. A full release does not proceed unless every
  # integration test passes; a prerelease (vX.Y.Z-<suffix>) passes allowFailures=true so
  # the release still proceeds despite individual test failures, while any environmental
  # break (Pester missing, module not resolving, etc.) still fails the gate.
  workflow_call:
    inputs:
      moduleVersion:
        description: >-
          Version to build and test. The publish workflow passes the version derived
          from the release tag so the tests exercise the exact build being released.
          Left empty, the build falls back to the manifest version.
        required: false
        type: string
      allowFailures:
        description: >-
          Exit 0 even if individual integration tests fail. Set by publish.yml on a
          prerelease tag. Setup/infrastructure failures still fail the run.
        required: false
        default: false
        type: boolean
  # TEMPORARY - see the note at the top of this file.
  #
  # There is deliberately no `branches:` filter here. For `pull_request`, `branches:`
  # matches the BASE branch (what the PR merges into), not the head branch the work is
  # on - a `branches: [resource-add/**]` filter would therefore match nothing, since
  # these PRs target main. Selecting on the head branch has to happen in a job-level
  # condition, which is what `if: startsWith(github.head_ref, ...)` below does.
  #
  # `ready_for_review` is included alongside the defaults so that taking a PR out of
  # draft also starts a run. Draft PRs are NOT excluded - the point of the prefix is that
  # these branches get exercised against a real organization while they are being worked
  # on, which is exactly when the PR is still a draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# The suite takes the better part of an hour against a live organization on a single
# self-hosted runner, so a PR that is pushed to repeatedly must not stack up runs. Each
# PR gets its own group and supersedes its own earlier run. Cancelling mid-run can leave
# resources behind in the organization, which is tolerable here only because
# Invoke-Tests.ps1 runs a teardown BEFORE the suite as well as after, so the next run
# clears whatever a cancelled one stranded.
concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide which resource test files the change actually needs, so a narrow pull request
  # does not pay for a two-hour run against a live organization.
  #
  # A separate job, on a hosted runner, for two reasons: the AZDO-AGENT runner is a single
  # shared machine and should not be occupied to compute a diff, and gating the expensive
  # job on this one's output makes an unaffected pull request report an honest `skipped`
  # rather than a green run that exercised nothing.
  #
  # The selector's own unit tests run in unit-tests.yml, not here - this job has no Pester
  # and deliberately depends on nothing from PowerShell Gallery.
  select-tests:
    name: Select Affected Tests
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'resource-add/')
    outputs:
      should-run: ${{ steps.select.outputs.should-run }}
      run-all: ${{ steps.select.outputs.run-all }}
      test-names: ${{ steps.select.outputs.test-names }}
      reason: ${{ steps.select.outputs.reason }}

    steps:
      # fetch-depth: 0 because the default shallow clone has no merge base to diff against.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected test files
        id: select
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          . ./tests/Integration/Supporting/Functions/Get-AffectedIntegrationTest.ps1

          # An explicit scope declared in the pull request body wins over the diff:
          #
          #   Integration-Tests: AzDoWorkItemQuery, AzDoSecureFile
          #
          # This exists because the diff cannot always be narrowed usefully. Adding
          # comment-based help to a class file is indistinguishable from changing its
          # behaviour when all you have is the path - the .PARAMETER blocks added across 28
          # existing resources selected all 28, none of which could behave differently. Rather
          # than guess by parsing comments out of the diff and risk dropping a test that
          # mattered, the author states the scope and it is visible in the pull request.
          #
          # Only ever honoured for a pull request, so it cannot weaken the release gate. A name
          # that does not resolve fails this job rather than quietly shrinking the run.
          $declared = @()
          if ($env:EVENT_NAME -eq 'pull_request' -and -not [String]::IsNullOrWhiteSpace($env:PR_BODY))
          {
              $match = [regex]::Match($env:PR_BODY, '(?im)^[ \t]*Integration-Tests:[ \t]*(?<names>.+?)[ \t]*$')
              if ($match.Success)
              {
                  $declared = @($match.Groups['names'].Value -split '[,\s]+' | Where-Object { $_ })
              }
          }

          if ($declared.Count -gt 0)
          {
              $available = @(Get-ChildItem -Path './tests/Integration/Resources' -Filter '*.tests.ps1' -File |
                  ForEach-Object { $_.Name -replace '\.tests\.ps1$', '' })

              $unknown = @($declared | Where-Object { $_ -notin $available })
              if ($unknown.Count -gt 0)
              {
                  Write-Error ("The pull request body declares Integration-Tests names that do not resolve to a test file: {0}. Known: {1}" -f
                      ($unknown -join ', '), ($available -join ', '))
                  exit 1
              }

              $result = @{
                  RunAll = $false
                  Path   = @($declared | ForEach-Object { "tests/Integration/Resources/$_.tests.ps1" })
                  Reason = "Scope declared in the pull request body: $($declared -join ', '). The release gate still runs all $($available.Count) files."
              }
          }
          elseif ($env:EVENT_NAME -ne 'pull_request')
          {
              # A dispatch or the release gate cannot be narrowed - there is no diff to
              # narrow against, and a release must be gated on everything.
              #
              # This is what makes narrowing a pull request safe. publish.yml fires on a v*
              # tag push and calls this workflow, so github.event_name there is 'push', not
              # 'pull_request' - the release gate lands here and runs all 63 files whatever
              # the diff says.
              $result = @{ RunAll = $true; Path = @(); Reason = "Event '$($env:EVENT_NAME)' always runs the full suite." }
          }
          else
          {
              # Three-dot: compare against the merge base, so commits that landed on main
              # after this branch started are not counted as this PR's changes.
              $changed = @(git diff --name-only "$($env:BASE_SHA)...$($env:HEAD_SHA)" 2>$null)

              if ($LASTEXITCODE -ne 0 -or $null -eq $changed)
              {
                  $result = @{ RunAll = $true; Path = @(); Reason = 'Could not determine the changed files - running the full suite rather than guessing.' }
              }
              else
              {
                  Write-Host "Changed files ($($changed.Count)):"
                  $changed | ForEach-Object { Write-Host "  $_" }

                  # -NarrowSharedChanges: on a pull request, run only the resources the change
                  # attributes to, even when it also touches shared code. Without it a change
                  # to the REST wrapper, the ACL token layer or a cache helper widens the run
                  # to all 63 files - correct in principle, but it costs ~100 minutes against a
                  # live organization for feedback on a handful of resources. The full suite is
                  # not skipped, only deferred to the release gate: a v* tag push runs it in
                  # its entirety via the branch above.
                  $result = Get-AffectedIntegrationTest -ChangedPath $changed -IntegrationTestRoot './tests/Integration' -NarrowSharedChanges
              }
          }

          # Names, not paths: the runner that executes the suite has its own checkout.
          $names = @($result.Path | ForEach-Object { (Split-Path -Path $_ -Leaf) -replace '\.tests\.ps1$', '' } | Sort-Object)
          $shouldRun = $result.RunAll -or $names.Count -gt 0

          Write-Host ''
          Write-Host "Decision : $($result.Reason)"
          Write-Host "RunAll   : $($result.RunAll)"
          Write-Host "Selected : $(if ($names.Count) { $names -join ', ' } else { '(none)' })"
          Write-Host "ShouldRun: $shouldRun"

          "should-run=$($shouldRun.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run-all=$($result.RunAll.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "test-names=$($names -join ',')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "reason=$($result.Reason)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          "## Integration test selection`n`n$($result.Reason)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  integration-tests:
    name: Run Integration Tests
    needs: select-tests
    # Two gates, both of which must hold:
    #
    #   1. The HEAD branch prefix - see the trigger comment above for why this cannot be a
    #      `branches:` filter. Non-PR events have an empty github.head_ref, so they are
    #      admitted by the first clause and keep their existing dispatch-only behaviour.
    #      Draft state is deliberately NOT part of it: the prefix exists so that a batch of
    #      new resources is exercised against a real organization while it is in progress,
    #      and a PR in progress is normally a draft - excluding drafts meant the suite never
    #      ran for the one case it was enabled for.
    #
    #   2. select-tests found something worth running. A change that touches no resource
    #      with integration coverage skips the live run outright, which reports as
    #      `skipped` - honest - rather than as a pass over an empty selection.
    if: >-
      needs.select-tests.outputs.should-run == 'true' &&
      (github.event_name != 'pull_request' ||
       startsWith(github.head_ref, 'resource-add/'))
    runs-on: AZDO-AGENT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          .\build.ps1 -Tasks noop -ResolveDependency

      - name: Build module
        shell: pwsh
        env:
          ModuleVersion: ${{ inputs.moduleVersion }}
        run: |
          .\build.ps1 -Tasks build

      # The self-hosted runner does not ship Pester 5, and Invoke-Tests.ps1 declares
      # `#Requires -Modules @{ ModuleName="Pester"; ModuleVersion="5.0.0" }`, so without
      # this the script refuses to start and the suite never runs at all. Pinned to the
      # same version the unit test and publish workflows install.
      #
      # Saved into a workspace-local folder rather than installed with `-Scope CurrentUser`.
      # CurrentUser resolves to the runner's profile module directory, which on this
      # persistent runner also carries a hand-installed DscResource.Common - so Pester
      # living there forced that whole directory onto PSModulePath, giving DscResource.Common
      # a second location and tripping the duplicate assertion below. Keeping Pester under
      # ./output/TestModules lets the profile directory be dropped entirely.
      - name: Install Pester
        shell: pwsh
        run: |
          $pesterRoot = Join-Path -Path (Resolve-Path -Path .\output).Path -ChildPath 'TestModules'
          New-Item -Path $pesterRoot -ItemType Directory -Force | Out-Null

          # PSResourceGet is what build.ps1's bootstrap already uses on this runner; fall
          # back to Save-Module so this step does not depend on which one is present.
          if (Get-Command -Name Save-PSResource -ErrorAction SilentlyContinue) {
              Save-PSResource -Name Pester -Version 5.7.1 -Path $pesterRoot -TrustRepository -SkipDependencyCheck
          }
          else {
              Save-Module -Name Pester -RequiredVersion 5.7.1 -Path $pesterRoot -Force
          }

          $manifest = Join-Path -Path $pesterRoot -ChildPath 'Pester\5.7.1\Pester.psd1'
          if (-not (Test-Path -Path $manifest)) {
              throw "Pester 5.7.1 was not saved to '$pesterRoot' - Invoke-Tests.ps1 cannot run. Found: $((Get-ChildItem -Path $pesterRoot -Recurse -Filter 'Pester.psd1' | Select-Object -ExpandProperty FullName) -join ' ; ')"
          }
          Write-Host "Pester 5.7.1 saved to $pesterRoot"
          "PESTER_MODULE_ROOT=$pesterRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Point PSModulePath at exactly one copy of each module the tests load.
      #
      # Initalize-TestFramework.ps1 imports DscResource.Common, AzureDevOpsDsc.Common and
      # AzureDevOpsDscNative by bare name. AzureDevOpsDscNative lives at
      # output/builtModule/<Module>/<Version>; its nested modules (AzureDevOpsDsc.Common,
      # and DscResource.Common which build.yaml copies in) live one level down under
      # /Modules. The version comes from the build, so those are globbed.
      #
      # Crucially, each of these modules must resolve from exactly ONE location. If a
      # module is reachable from two places, Get-Module returns an array and DSC's
      # GetResourceFromKeyword throws "Cannot convert System.Object[] to PSModuleInfo"
      # inside Invoke-DscResource - which fails every test. Two sources of duplication
      # are removed here rather than merely shadowed by prepending:
      #   - output/RequiredModules also holds DscResource.Common (the built module already
      #     bundles it under /Modules), so it is left off the path entirely;
      #   - the self-hosted runner carries stale hand-deployed copies under
      #     C:\Temp\DSCModule (including an old 0.0.1 module under the former name), which
      #     are stripped from the inherited PSModulePath; and
      #   - the runner's *profile* module directory (<MyDocuments>\PowerShell\Modules) holds
      #     a hand-installed DscResource.Common 0.24.5, and is also where
      #     scripts/redeploy-module.ps1 deploys AzureDevOpsDscNative - so it can supply a
      #     second copy of two of the three modules asserted below. It is dropped as well,
      #     which is why the step above saves Pester into ./output/TestModules instead of
      #     installing it there.
      #
      # ./output/TestModules is re-added explicitly after the ./output filter, since that
      # filter would otherwise remove the very directory Pester was just saved to.
      - name: Set PSModulePath to the built module only
        shell: pwsh
        run: |
          $outputPath = (Resolve-Path -Path .\output).Path
          $builtModulePath = Join-Path -Path $outputPath -ChildPath 'builtModule'
          $nestedModulePaths = @(
              Get-ChildItem -Path (Join-Path -Path $builtModulePath -ChildPath '*/*/Modules') -Directory -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName
          )

          # Where the previous step saved Pester. Resolved from the same expression rather
          # than $env:PESTER_MODULE_ROOT so this step still works when re-run standalone.
          $pesterRoot = Join-Path -Path $outputPath -ChildPath 'TestModules'

          # Keep the runner's system module paths (base modules) but drop anything under
          # this repo's ./output, any stale C:\Temp\DSCModule copies, and the user profile
          # module directory, so nothing outside the freshly built module can provide a
          # second copy of the modules asserted below.
          $profileModuleRoot = Join-Path -Path ([Environment]::GetFolderPath('MyDocuments')) -ChildPath 'PowerShell\Modules'
          $keep = $env:PSModulePath -split ';' | Where-Object {
              $_ -and
              $_ -notlike "$outputPath*" -and
              $_ -notlike 'C:\Temp\DSCModule*' -and
              $_.TrimEnd('\') -ne $profileModuleRoot.TrimEnd('\')
          }

          $ordered = @($builtModulePath) + $nestedModulePaths + @($pesterRoot) + $keep
          $env:PSModulePath = ($ordered | Where-Object { $_ } | Select-Object -Unique) -join ';'

          # Persist for subsequent steps via $GITHUB_ENV
          "PSModulePath=$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'PSModulePath entries:'
          $env:PSModulePath -split ';' | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }

          # Assert each module resolves from exactly one location. Asserting "-ge 1" is what
          # let the duplicate through last time; the duplicate itself is the failure mode, so
          # fail here naming the module and its locations rather than deep inside DSC.
          foreach ($name in 'DscResource.Common', 'AzureDevOpsDsc.Common', 'AzureDevOpsDscNative') {
              $bases = @(Get-Module -Name $name -ListAvailable | Select-Object -ExpandProperty ModuleBase -Unique)
              if ($bases.Count -eq 0) {
                  throw "Module '$name' is not resolvable on PSModulePath after the build - the integration tests cannot initialise."
              }
              if ($bases.Count -gt 1) {
                  throw "Module '$name' resolves from $($bases.Count) locations, which makes Invoke-DscResource throw on a [PSModuleInfo] cast: $($bases -join ' ; ')"
              }
              Write-Host "Resolved $name -> $($bases[0])"
          }

          # Pester moved off the profile module directory with this path rewrite, so check
          # it is still reachable here rather than letting Invoke-Tests.ps1 fail its
          # #Requires later. Not part of the strict loop above: Windows ships Pester 3.4.0
          # under C:\Program Files\WindowsPowerShell\Modules, so Pester legitimately
          # resolves from more than one location and the 5.x copy simply has to win.
          $pester5 = Get-Module -Name Pester -ListAvailable |
              Where-Object Version -ge ([version]'5.0.0') |
              Sort-Object Version -Descending |
              Select-Object -First 1
          if (-not $pester5) {
              throw "Pester 5.x is not resolvable on the rewritten PSModulePath - Invoke-Tests.ps1 would refuse to start."
          }
          Write-Host "Resolved Pester $($pester5.Version) -> $($pester5.ModuleBase)"

      - name: Write test framework configuration
        shell: pwsh
        env:
          AZURE_DEVOPS_ORG: ${{ vars.AzureDevOpsOrg }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          if ([string]::IsNullOrEmpty($env:AZURE_DEVOPS_ORG)) {
              throw "Required variable 'AzureDevOpsOrg' is not set. " +
                    "Add it under Settings > Secrets and variables > Actions > Variables."
          }
          $authType = if (-not [string]::IsNullOrEmpty($env:AZURE_DEVOPS_PAT)) { 'PAT' } else { 'ManagedIdentity' }
          Write-Host "Organization : $($env:AZURE_DEVOPS_ORG)"
          Write-Host "Auth type    : $authType"

          $config = [ordered]@{
              Organization       = $env:AZURE_DEVOPS_ORG
              AuthenticationType = $authType
              excludedProjectsFromTeardown = @()
          }
          if ($authType -eq 'PAT') {
              $config.PATToken = $env:AZURE_DEVOPS_PAT
          }
          $config | ConvertTo-Json -Depth 3 |
              Set-Content -Path .\tests\Integration\TestFrameworkConfiguration.json -Encoding UTF8
          Write-Host "TestFrameworkConfiguration.json written."

      - name: Prepare cache directory
        shell: pwsh
        run: |
          $cacheDir = Join-Path $env:TEMP 'AzureDevOpsDscCache'
          New-Item -Path $cacheDir -ItemType Directory -Force | Out-Null
          "AZDODSC_CACHE_DIRECTORY=$cacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Cache directory: $cacheDir"

      - name: Prepare results directory
        shell: pwsh
        run: |
          New-Item -Path 'C:\Temp' -ItemType Directory -Force | Out-Null

      - name: Run integration tests
        shell: pwsh
        working-directory: tests/Integration
        env:
          # Booleans from workflow inputs arrive as PowerShell literals. Normalise to a
          # bare 'true'/'false' string so the pwsh block below can treat it uniformly.
          # On the pull_request trigger there are no inputs at all, so this evaluates to
          # 'false' and a failing test fails the run - which is the point of the gate.
          ALLOW_FAILURES: ${{ inputs.allowFailures && 'true' || 'false' }}
          # Empty when select-tests decided the whole suite is needed (a shared-code change,
          # a dispatch, or the release gate). Otherwise the comma-separated base names of the
          # test files the change maps to.
          RUN_ALL: ${{ needs.select-tests.outputs.run-all }}
          SELECTED_TESTS: ${{ needs.select-tests.outputs.test-names }}
          SELECTION_REASON: ${{ needs.select-tests.outputs.reason }}
        run: |
          $params = @{ TestFrameworkConfigurationPath = '.\TestFrameworkConfiguration.json' }
          if ($env:ALLOW_FAILURES -eq 'true') {
              Write-Host 'AllowFailures is enabled - test failures will be reported but will not fail this run.'
              $params['AllowFailures'] = $true
          }

          Write-Host "Selection: $($env:SELECTION_REASON)"

          # Narrow the run only on an explicit 'false'. Anything else - an empty string from
          # a job that did not set it, an unexpected value - falls through to the full suite,
          # so a wiring mistake costs time rather than coverage.
          if ($env:RUN_ALL -eq 'false' -and -not [String]::IsNullOrWhiteSpace($env:SELECTED_TESTS)) {
              $params['TestName'] = $env:SELECTED_TESTS -split ',' | Where-Object { $_ }
              Write-Host "Running selected tests only: $($params['TestName'] -join ', ')"
          }
          else {
              Write-Host 'Running the full integration suite.'
          }

          .\Invoke-Tests.ps1 @params

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ github.run_number }}
          path: C:\Temp\integration-test-results.xml
          if-no-files-found: ignore
