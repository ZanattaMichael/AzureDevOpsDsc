name: Publish

# Releases are tag-driven. Pushing a tag of the form vX.Y.Z (or vX.Y.Z-preview0001
# for a prerelease) is the single action that cuts a release: the tag is the
# authoritative source of the module version, and it is baked into the manifest at
# build time via $env:ModuleVersion.
#
# Release gates, in order. Nothing is published unless all of them pass:
#   1. The tag is a valid version tag and points at a commit contained in main.
#   2. Every integration test passes, against a live Azure DevOps organization.
#   3. Both unit test suites pass against the freshly built module.
#
# Required repository secrets:
#   GALLERY_API_TOKEN  - PowerShell Gallery API key. If unset, the Gallery publish
#                        is skipped and only the GitHub Release is created.
#   AZURE_DEVOPS_PAT   - PAT for the integration tests (see integration-tests.yml).
# Required repository variable:
#   AzureDevOpsOrg     - Azure DevOps organization the integration tests run against.
# GITHUB_TOKEN is provided automatically and is used for the GitHub Release, the
# wiki push, and the changelog roll-over pull request.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      isPrerelease: ${{ steps.derive.outputs.isPrerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive module version from tag
        id: derive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          # Accept X.Y.Z and X.Y.Z-<prerelease>. The PowerShell Gallery requires the
          # prerelease suffix to be alphanumeric only - no dots, no extra hyphens.
          if ($version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9]+)?$') {
              Write-Error "Tag '$tag' is not a valid version tag. Expected vX.Y.Z (e.g. v1.2.3) or vX.Y.Z-<prerelease> (e.g. v1.2.3-preview0001)."
              exit 1
          }
          $isPrerelease = $version.Contains('-')
          Write-Host "Publishing version $version (from tag $tag). Prerelease: $isPrerelease"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "isPrerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # A tag can be pushed pointing at any commit, including one that never went
      # through the Unit Tests workflow on main. Refuse to release from such a tag.
      - name: Verify tag is on main
        shell: pwsh
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --quiet
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tag '${{ github.ref_name }}' does not point at a commit contained in main. Releases must be tagged from main."
              exit 1
          }
          Write-Host "Tag commit is contained in main."

  # Release gate: every integration test must pass before anything is published.
  # This reuses integration-tests.yml rather than duplicating it, so the release runs
  # exactly the suite that is maintained there, on its self-hosted AZDO-AGENT runner.
  # If the runner is offline the release queues here rather than failing.
  integration-tests:
    name: Integration Tests (release gate)
    needs: validate
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit
    with:
      moduleVersion: ${{ needs.validate.outputs.version }}

  publish:
    name: Build, Test, and Publish Release
    needs: [validate, integration-tests]
    runs-on: windows-latest
    env:
      # $env:ModuleVersion has to be set before the *first* `build` task runs (not just
      # before pack), since that is what bakes the version into the psd1. Setting it at
      # job level makes it active for every step below.
      ModuleVersion: ${{ needs.validate.outputs.version }}
      IsPrerelease: ${{ needs.validate.outputs.isPrerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache required build modules
        uses: actions/cache@v4
        with:
          path: output/RequiredModules
          key: ${{ runner.os }}-requiredmodules-${{ hashFiles('RequiredModules.psd1') }}

      - name: Build module
        shell: pwsh
        run: |
          ./build.ps1 -ResolveDependency -Tasks build

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      # Release gate: never publish a version whose tests don't pass, even though tagging main
      # implies it already passed Unit Tests once - a tag can (accidentally) point anywhere.
      - name: Run Classes unit tests
        shell: pwsh
        run: |
          $builtModulesDir = (Get-ChildItem -Path "$PWD\output\builtModule\AzureDevOpsDscNative\*\Modules" -Directory -ErrorAction Stop | Select-Object -First 1).FullName
          $env:PSModulePath = "$PWD\output\RequiredModules;$PWD\output\builtModule;$builtModulesDir;$env:PSModulePath"
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force
          ./azuredevopsdsc.tests.ps1 *>&1 | Tee-Object -Variable output
          $joined = $output | Out-String
          $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
          if (-not $failedMatch -or [int]$failedMatch.Groups[1].Value -gt 0) {
              Write-Error "Classes suite has failing tests - refusing to publish."
              exit 1
          }

      - name: Run Common module unit tests
        shell: pwsh
        run: |
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force
          ./azuredevopsdsc.common.tests.ps1 *>&1 | Tee-Object -Variable output
          $joined = $output | Out-String
          $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
          if (-not $failedMatch -or [int]$failedMatch.Groups[1].Value -gt 0) {
              Write-Error "Common suite has failing tests - refusing to publish."
              exit 1
          }

      # `docs` must run here, not just `dscv3`: Generate_Conceptual_Help writes the
      # about_*.help.txt files into the *built* module, so skipping it ships a Gallery
      # package with no conceptual help. It also produces output/WikiContent, which the
      # wiki publish step below consumes. Kept as its own step so a doc-generation
      # failure is attributable at a glance rather than hidden inside packaging.
      - name: Generate documentation
        shell: pwsh
        run: |
          ./build.ps1 -Tasks docs

      - name: Generate DSC v3 manifests and package module
        shell: pwsh
        run: |
          ./build.ps1 -Tasks dscv3,package_module_nupkg

      # Both sub-tasks self-guard on their own token being set, so this is safe to run
      # even if GALLERY_API_TOKEN isn't configured yet - it just skips the Gallery
      # publish and still creates the GitHub Release.
      - name: Publish release
        shell: pwsh
        run: |
          ./build.ps1 -Tasks publish
        env:
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
          GalleryApiToken: ${{ secrets.GALLERY_API_TOKEN }}
          ReleaseBranch: main
          MainGitBranch: main

      # Non-blocking: the repository wiki has to be enabled and initialised before this
      # can push to it. A wiki failure must not fail a release whose Gallery package has
      # already been published, so this step is allowed to fail.
      - name: Publish GitHub wiki content
        continue-on-error: true
        shell: pwsh
        run: |
          ./build.ps1 -Tasks Publish_GitHub_Wiki_Content
        env:
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
          ReleaseBranch: main
          MainGitBranch: main

      # Rolls the CHANGELOG's [Unreleased] section over into a versioned section on main
      # via a pull request. Without this the next release's notes would still contain
      # this release's entries. Prereleases are excluded to match the
      # `UpdateChangelogOnPrerelease: false` setting in build.yaml.
      - name: Send changelog roll-over pull request
        if: env.IsPrerelease == 'false'
        shell: pwsh
        run: |
          ./build.ps1 -Tasks Create_ChangeLog_GitHub_PR
        env:
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
          ReleaseBranch: main
          MainGitBranch: main

      - name: Upload release package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.ref_name }}
          path: |
            output/*.nupkg
            output/builtModule/**
          if-no-files-found: warn
          retention-days: 30
