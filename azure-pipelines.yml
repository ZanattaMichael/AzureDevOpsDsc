# Azure Pipelines build, test and (opt-in) release for AzureDevOpsDscNative.
#
# GitHub Actions is the primary CI and release path for this repository (see
# .github/workflows). This pipeline mirrors the same build and unit-test steps so the
# module can also be built and released from an Azure DevOps organization, and it
# follows the GitHub workflows rather than the DSC Community template it started from:
#
#   - Unit tests run the two suite entry scripts directly under Pester 5.7.1, exactly
#     as unit-tests.yml does. `build.ps1 -tasks test` is not used: RequiredModules.psd1
#     pins Pester 4.10.1 for the Sampler tasks, and the tests are written for Pester 5.
#   - Only Windows / PowerShell 7 is a gating platform, matching unit-tests.yml. Linux
#     has a known set of environment-specific failures (DPAPI SecureStrings and
#     Windows-only fixtures), so it cannot be a gate.
#
# Releasing is opt-in. publish.yml already publishes tags to the PowerShell Gallery, and
# the Gallery refuses a version that already exists, so this pipeline only deploys when
# the pipeline variable `PublishRelease` is set to `true` (with the GalleryApiToken and
# GitHubToken secrets alongside it). Leave it unset while publish.yml is the release path.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - source/*
      - tests/*
      - build.ps1
      - build.yaml
      - RequiredModules.psd1
      - azure-pipelines.yml
  tags:
    include:
      - 'v*'

variables:
  buildFolderName: output
  buildArtifactName: output
  testResultFolderName: testResults
  defaultBranch: main
  pesterVersion: '5.7.1'

stages:
  - stage: Build
    jobs:
      - job: Package_Module
        displayName: 'Package Module'
        pool:
          vmImage: 'windows-latest'
        steps:
          # GitVersion needs the full history and tags. Azure Pipelines defaults new
          # pipelines to a shallow fetch, on which GitVersion fails or computes the wrong
          # version.
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          # GitVersion.Tool 5.x targets .NET 6/7, which current hosted images no longer
          # ship. DOTNET_ROLL_FORWARD lets it run on the newer runtime the image does have.
          # Pinned to 5.x because GitVersion.yml uses the v5 configuration schema.
          - pwsh: |
              dotnet tool install --global GitVersion.Tool --version 5.12.0
              if ($LASTEXITCODE -ne 0) { throw 'Installing GitVersion.Tool failed.' }
              $gitVersionJson = dotnet-gitversion
              if ($LASTEXITCODE -ne 0) { throw "GitVersion failed:`n$($gitVersionJson -join "`n")" }
              $gitVersionObject = $gitVersionJson | ConvertFrom-Json
              $gitVersionObject.PSObject.Properties.ForEach{
                  Write-Host -Object "Setting Task Variable '$($_.Name)' with value '$($_.Value)'."
                  Write-Host -Object "##vso[task.setvariable variable=$($_.Name);]$($_.Value)"
              }
              Write-Host -Object "##vso[build.updatebuildnumber]$($gitVersionObject.FullSemVer)"
            displayName: 'Calculate ModuleVersion (GitVersion)'
            env:
              DOTNET_ROLL_FORWARD: Major

          - task: PowerShell@2
            name: package
            displayName: 'Build & Package Module'
            inputs:
              filePath: './build.ps1'
              arguments: '-ResolveDependency -tasks pack'
              pwsh: true
            env:
              ModuleVersion: $(NuGetVersionV2)

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Build Artifact'
            inputs:
              targetPath: '$(buildFolderName)/'
              artifact: $(buildArtifactName)
              publishLocation: 'pipeline'

  - stage: Test
    dependsOn: Build
    jobs:
      - job: test_unit_windows_core
        displayName: 'Windows (PowerShell 7) - Unit Tests'
        timeoutInMinutes: 60
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: 'current'
              artifactName: $(buildArtifactName)
              targetPath: '$(Build.SourcesDirectory)/$(buildFolderName)'

          - pwsh: |
              Install-Module -Name Pester -RequiredVersion $(pesterVersion) -Force -SkipPublisherCheck -Scope CurrentUser
            displayName: 'Install Pester $(pesterVersion)'

          # Same invocation as unit-tests.yml. The Classes suite resolves its types with
          # `using module AzureDevOpsDscNative`, so the built module and its nested Modules
          # folder must be on PSModulePath before the script is parsed.
          - pwsh: |
              $builtModulesDir = (Get-ChildItem -Path "$PWD\$(buildFolderName)\builtModule\AzureDevOpsDscNative\*\Modules" -Directory -ErrorAction Stop | Select-Object -First 1).FullName
              $env:PSModulePath = "$PWD\$(buildFolderName)\RequiredModules;$PWD\$(buildFolderName)\builtModule;$builtModulesDir;$env:PSModulePath"
              Import-Module -Name Pester -RequiredVersion $(pesterVersion) -Force
              ./azuredevopsdsc.tests.ps1 *>&1 | Tee-Object -Variable output
              New-Item -Path '$(buildFolderName)/$(testResultFolderName)' -ItemType Directory -Force | Out-Null
              $output | Out-File -FilePath '$(buildFolderName)/$(testResultFolderName)/classes-tests.log' -Encoding utf8
              $joined = $output | Out-String
              $passedMatch = [regex]::Matches($joined, 'Tests Passed:\s*(\d+)') | Select-Object -Last 1
              $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
              if (-not $passedMatch -or -not $failedMatch) {
                  Write-Error 'Could not find a test result summary in the output.'
                  exit 1
              }
              $failed = [int]$failedMatch.Groups[1].Value
              Write-Host "Classes suite -> Passed: $($passedMatch.Groups[1].Value), Failed: $failed"
              if ($failed -gt 0) {
                  Write-Error "$failed unit test(s) failed in the Classes suite."
                  exit 1
              }
            displayName: 'Run Classes unit tests'

          - pwsh: |
              Import-Module -Name Pester -RequiredVersion $(pesterVersion) -Force
              ./azuredevopsdsc.common.tests.ps1 *>&1 | Tee-Object -Variable output
              $output | Out-File -FilePath '$(buildFolderName)/$(testResultFolderName)/common-tests.log' -Encoding utf8
              $joined = $output | Out-String
              $passedMatch = [regex]::Matches($joined, 'Tests Passed:\s*(\d+)') | Select-Object -Last 1
              $failedMatch = [regex]::Matches($joined, 'Failed:\s*(\d+)') | Select-Object -Last 1
              if (-not $passedMatch -or -not $failedMatch) {
                  Write-Error 'Could not find a test result summary in the output.'
                  exit 1
              }
              $failed = [int]$failedMatch.Groups[1].Value
              Write-Host "Common suite -> Passed: $($passedMatch.Groups[1].Value), Failed: $failed"
              if ($failed -gt 0) {
                  Write-Error "$failed unit test(s) failed in the Common suite."
                  exit 1
              }
            displayName: 'Run Common module unit tests'
            condition: succeededOrFailed()

          - pwsh: |
              Import-Module -Name Pester -RequiredVersion $(pesterVersion) -Force
              $config = New-PesterConfiguration
              $config.Run.Path = './tests/Integration/Get-AffectedIntegrationTest.tests.ps1'
              $config.Run.PassThru = $true
              $config.Output.Verbosity = 'Detailed'
              $config.TestResult.Enabled = $true
              $config.TestResult.OutputFormat = 'NUnitXml'
              $config.TestResult.OutputPath = '$(buildFolderName)/$(testResultFolderName)/NUnit_Selector.xml'
              New-Item -Path '$(buildFolderName)/$(testResultFolderName)' -ItemType Directory -Force | Out-Null
              $result = Invoke-Pester -Configuration $config
              if ($null -eq $result -or $result.FailedCount -gt 0) {
                  Write-Error 'Integration test selector tests failed.'
                  exit 1
              }
            displayName: 'Run integration test selector tests'
            condition: succeededOrFailed()

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'NUnit'
              testResultsFiles: '$(buildFolderName)/$(testResultFolderName)/NUnit*.xml'
              testRunTitle: 'Windows (PowerShell 7) - Unit'

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Test Logs'
            condition: succeededOrFailed()
            inputs:
              targetPath: '$(buildFolderName)/$(testResultFolderName)/'
              artifact: 'unit-test-logs_$(System.JobAttempt)'

      # DscResource.Test quality checks. Reported but not gating: no workflow in
      # .github/workflows runs them, so their current state is unknown.
      - job: Test_HQRM
        displayName: 'HQRM (non-gating)'
        continueOnError: true
        timeoutInMinutes: 60
        pool:
          vmImage: 'windows-latest'
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: 'current'
              artifactName: $(buildArtifactName)
              targetPath: '$(Build.SourcesDirectory)/$(buildFolderName)'

          - task: PowerShell@2
            name: test
            displayName: 'Run HQRM Test'
            inputs:
              filePath: './build.ps1'
              arguments: '-ResolveDependency -Tasks hqrmtest'
              pwsh: true

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'NUnit'
              testResultsFiles: '$(buildFolderName)/$(testResultFolderName)/NUnit*.xml'
              testRunTitle: 'HQRM'

  - stage: Deploy
    dependsOn: Test
    # The previous condition required the collection URI to contain 'dsccommunity', a
    # leftover from the DSC Community template that made this stage unreachable from any
    # other organization. Deployment is now an explicit opt-in (see the header).
    condition: |
      and(
        succeeded(),
        eq(variables['PublishRelease'], 'true'),
        startsWith(variables['Build.SourceBranch'], 'refs/tags/v')
      )
    jobs:
      - job: Deploy_Module
        displayName: 'Deploy Module'
        pool:
          vmImage: 'windows-latest'
        steps:
          - checkout: self
            fetchDepth: 0
            fetchTags: true

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Build Artifact'
            inputs:
              buildType: 'current'
              artifactName: $(buildArtifactName)
              targetPath: '$(Build.SourcesDirectory)/$(buildFolderName)'

          - task: PowerShell@2
            name: publishRelease
            displayName: 'Publish Release'
            inputs:
              filePath: './build.ps1'
              arguments: '-ResolveDependency -tasks publish'
              pwsh: true
            env:
              GitHubToken: $(GitHubToken)
              GalleryApiToken: $(GalleryApiToken)
              ReleaseBranch: $(defaultBranch)
              MainGitBranch: $(defaultBranch)

          # Prereleases leave the changelog alone, matching UpdateChangelogOnPrerelease in
          # build.yaml and the same rule in publish.yml.
          - task: PowerShell@2
            name: sendChangelogPR
            displayName: 'Send Changelog PR'
            condition: and(succeeded(), not(contains(variables['Build.SourceBranchName'], '-')))
            inputs:
              filePath: './build.ps1'
              arguments: '-tasks Create_ChangeLog_GitHub_PR'
              pwsh: true
            env:
              GitHubToken: $(GitHubToken)
              ReleaseBranch: $(defaultBranch)
              MainGitBranch: $(defaultBranch)
